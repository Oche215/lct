<script>
    function drawChart() {

// Set Data
const data = google.visualization.arrayToDataTable([
  ['Country', 'Mhl'],
  ['Italy', 55],
  ['France', 49],
  ['Spain', 44],
  ['USA', 24],
  ['Argentina', 15]
]);

// Set Options
const options = {
  title: 'World Wide Wine Production',
  is3D: true
};

// Draw
const chart = new google.visualization.PieChart(document.getElementById('wineChart'));
chart.draw(data, options);

}
</script>
